name: Sanitize ORION sources

on:
  push:
    branches: [agent/reorganizar-aplicaciones]

permissions:
  contents: write

jobs:
  sanitize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reorganizar-aplicaciones
      - name: Remove default credentials from HTML sources
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('apps/orion-health')
          changed = []
          pattern = re.compile(r'(<input\b[^>]*\bid=["\']dbToken["\'][^>]*\bvalue=["\'])[^"\']*(["\'])', re.I)
          pattern_reverse = re.compile(r'(<input\b[^>]*\bvalue=["\'])[^"\']*(["\'][^>]*\bid=["\']dbToken["\'])', re.I)
          for path in root.rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              clean = pattern.sub(r'\1\2', text)
              clean = pattern_reverse.sub(r'\1\2', clean)
              if clean != text:
                  path.write_text(clean, encoding='utf-8')
                  changed.append(str(path))
          print('Sanitized:', ', '.join(changed) if changed else 'no changes')
          PY
      - name: Commit sanitized sources
        run: |
          if git diff --quiet; then
            echo "No credentials found in HTML defaults."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/orion-health
          git commit -m "Sanitize embedded ORION credentials"
          git push origin HEAD:agent/reorganizar-aplicaciones
