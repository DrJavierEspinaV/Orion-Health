<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#061a38">
  <title>ORION Armonización Orofacial</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#123250;background:#eef2f6}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#edf3f8,#f8fafc)}
    .boot{width:min(560px,100%);padding:28px;border:1px solid #d6e1ec;border-radius:22px;background:#fff;box-shadow:0 18px 50px rgba(16,43,77,.12);text-align:center}
    .boot img{width:78px;height:78px;object-fit:contain;border-radius:16px;border:1px solid #d8e2ec;background:#fff}
    .boot h1{margin:16px 0 6px;font-size:25px;color:#092a51}
    .boot p{margin:0;color:#657c94;line-height:1.5}
    .progress{height:8px;margin:22px 0 14px;border-radius:999px;background:#e7eef6;overflow:hidden}
    .progress i{display:block;width:42%;height:100%;border-radius:inherit;background:#1f64c8;animation:loading 1.05s ease-in-out infinite alternate}
    .status{font-size:13px;font-weight:800;color:#355b80}
    .error{display:none;margin-top:18px;padding:14px;border-radius:12px;background:#fff3f3;color:#9c3030;text-align:left;font-size:13px;line-height:1.45}
    .error button{width:100%;margin-top:12px;padding:11px;border:1px solid #1f64c8;border-radius:10px;background:#1f64c8;color:#fff;font-weight:900}
    @keyframes loading{from{transform:translateX(-65%)}to{transform:translateX(205%)}}
  </style>
</head>
<body>
  <main class="boot" id="bootScreen" role="status" aria-live="polite">
    <img src="../../assets/brand/orion-health.png" alt="ORION Health">
    <h1>ORION Armonización Orofacial</h1>
    <p>Preparando atlas clínicos homogéneos e informe carta independiente.</p>
    <div class="progress" aria-hidden="true"><i></i></div>
    <div class="status" id="bootStatus">Cargando módulo V1.6.7…</div>
    <div class="error" id="bootError">
      <strong>No fue posible iniciar el módulo.</strong>
      <div id="bootDetail"></div>
      <button type="button" id="bootRetry">Reintentar sin caché</button>
    </div>
  </main>

<script>
(async()=>{
  'use strict';

  const VERSION='1.6.7';
  const status=document.getElementById('bootStatus');
  const errorBox=document.getElementById('bootError');
  const detail=document.getElementById('bootDetail');
  const retry=document.getElementById('bootRetry');
  const cssFiles=[
    'performance-v163.css','anatomy-calibration-v146.css','workflow-v147.css','map-dynamic-v148.css','map-inline-v149.css','map-viewport-v150.css',
    'ui-optimization-v153.css','administration-only-v154.css','clinical-closure-v160.css','mobile-administration-v161.css','final-report-v162.css',
    'document-model-touch-v164.css','model-anatomy-v165.css','document-letter-atlas-v165.css','atlas-netter-v167.css'
  ];
  const jsFiles=[
    'performance-v163.js','anatomy-presets-v146.js','registro-v145.js','workflow-v147.js','map-dynamic-v148.js','map-inline-v149.js','map-viewport-v150.js',
    'standalone-v151.js','ui-optimization-v153.js','administration-only-v154.js','clinical-closure-v160.js','mobile-administration-v161.js','final-report-v162.js',
    'document-model-touch-v164.js','model-key-compat-v165.js','document-letter-atlas-v165.js','atlas-netter-v167.js'
  ];

  retry.addEventListener('click',()=>{
    const separator=location.search?'&':'?';
    location.replace(`${location.pathname}${location.search}${separator}reload=${Date.now()}`);
  });

  function appendStyles(doc){
    const baseStyle=doc.querySelector('link[href*="registro-v145.css"]');
    if(baseStyle)baseStyle.setAttribute('href',`./registro-v145.css?v=${VERSION}`);
    cssFiles.forEach(file=>{
      const link=doc.createElement('link');link.rel='stylesheet';link.href=`./${file}?v=${VERSION}`;doc.head.appendChild(link);
    });
  }

  function appendScripts(doc){
    doc.querySelectorAll('script[src]').forEach(script=>{
      const src=script.getAttribute('src')||'';
      if(src.includes('registro-v145.js'))script.remove();
      else script.setAttribute('src',src.split('?')[0]+`?v=${VERSION}`);
    });
    jsFiles.forEach(file=>{
      const script=doc.createElement('script');script.src=`./${file}?v=${VERSION}`;script.defer=false;doc.body.appendChild(script);
    });
  }

  function updateIdentity(doc){
    doc.title='ORION Armonización Orofacial V1.6.7';
    doc.documentElement.classList.add('oa-viewport-v150','oa-ui-v153','oa-admin-v154','oa-v160','oa-v161','oa-v162','oa-performance-v163','oa-v164-touch','oa-v165-model','oa-v167-atlas');
    doc.documentElement.dataset.orionAestheticsVersion=VERSION;

    const manifest=doc.createElement('link');manifest.rel='manifest';manifest.href=`./manifest.webmanifest?v=${VERSION}`;doc.head.appendChild(manifest);
    const appleIcon=doc.createElement('link');appleIcon.rel='apple-touch-icon';appleIcon.href='../../assets/icons/icon-192.png';doc.head.appendChild(appleIcon);

    const mark=doc.querySelector('.oa-brand-mark');
    if(mark){const logo=doc.createElement('img');logo.className='oa-brand-logo';logo.src='../../assets/brand/orion-health.png';logo.alt='ORION Health';mark.replaceWith(logo);}

    const title=doc.querySelector('.oa-title strong');
    const subtitle=doc.querySelector('.oa-title span');
    const version=doc.querySelector('.oa-version');
    const mapInstruction=doc.querySelector('.oa-map-head span');
    if(title)title.textContent='Registro de armonización orofacial';
    if(subtitle)subtitle.textContent='Atlas clínicos Mujer/Hombre e informe tamaño carta';
    if(version)version.textContent='V1.6.7';
    if(mapInstruction)mapInstruction.textContent='Mujer y Hombre utilizan el mismo lenguaje anatómico raster. El mapa final se muestra en Resumen y en el informe, no en Registro.';
  }

  try{
    status.textContent='Cargando estructura clínica…';
    const response=await fetch(`./registro-v145.html?base=1&v=${VERSION}&t=${Date.now()}`,{cache:'no-store'});
    if(!response.ok)throw new Error(`Base clínica HTTP ${response.status}`);

    const source=await response.text();
    const doc=new DOMParser().parseFromString(source,'text/html');
    if(!doc.getElementById('atlasShell')||!doc.getElementById('patientName'))throw new Error('La base clínica recibida está incompleta.');

    status.textContent='Integrando atlas clínicos y PDF sincronizado…';
    appendStyles(doc);updateIdentity(doc);appendScripts(doc);

    const output='<!doctype html>\n'+doc.documentElement.outerHTML;
    if(!output.includes('performance-v163.js')||!output.includes('document-letter-atlas-v165.js')||!output.includes('atlas-netter-v167.js'))throw new Error('No fue posible integrar los recursos funcionales V1.6.7.');

    document.open();document.write(output);document.close();
  }catch(error){
    console.error('ORION Armonización no pudo iniciar:',error);
    status.textContent='Error de inicio';detail.textContent=` ${error?.message||error}`;errorBox.style.display='block';
  }
})();
</script>
</body>
</html>
