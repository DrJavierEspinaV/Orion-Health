<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#061a38">
  <title>ORION Armonización Orofacial</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#123250;background:#eef2f6}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#edf3f8,#f8fafc)}
    .boot{width:min(560px,100%);padding:28px;border:1px solid #d6e1ec;border-radius:22px;background:#fff;box-shadow:0 18px 50px rgba(16,43,77,.12);text-align:center}
    .boot img{width:78px;height:78px;object-fit:contain;border-radius:16px;border:1px solid #d8e2ec;background:#fff}
    .boot h1{margin:16px 0 6px;font-size:25px;color:#092a51}
    .boot p{margin:0;color:#657c94;line-height:1.5}
    .progress{height:8px;margin:22px 0 14px;border-radius:999px;background:#e7eef6;overflow:hidden}
    .progress i{display:block;width:42%;height:100%;border-radius:inherit;background:#1f64c8;animation:loading 1.05s ease-in-out infinite alternate}
    .status{font-size:13px;font-weight:800;color:#355b80}
    .error{display:none;margin-top:18px;padding:14px;border-radius:12px;background:#fff3f3;color:#9c3030;text-align:left;font-size:13px;line-height:1.45}
    .error button{width:100%;margin-top:12px;padding:11px;border:1px solid #1f64c8;border-radius:10px;background:#1f64c8;color:#fff;font-weight:900}
    @keyframes loading{from{transform:translateX(-65%)}to{transform:translateX(205%)}}
  </style>
</head>
<body>
  <main class="boot" id="bootScreen" role="status" aria-live="polite">
    <img src="../../assets/brand/orion-health.png" alt="ORION Health">
    <h1>ORION Armonización Orofacial</h1>
    <p>Preparando el registro clínico, el mapa anatómico y la calculadora.</p>
    <div class="progress" aria-hidden="true"><i></i></div>
    <div class="status" id="bootStatus">Cargando módulo V1.5.1…</div>
    <div class="error" id="bootError">
      <strong>No fue posible iniciar el módulo.</strong>
      <div id="bootDetail"></div>
      <button type="button" onclick="location.reload()">Reintentar carga</button>
    </div>
  </main>

<script>
(async()=>{
  const VERSION='1.5.1';
  const status=document.getElementById('bootStatus');
  const errorBox=document.getElementById('bootError');
  const detail=document.getElementById('bootDetail');

  try{
    status.textContent='Cargando estructura clínica…';
    const response=await fetch(`./registro-v145.html?base=1&v=${VERSION}`,{cache:'no-store'});
    if(!response.ok)throw new Error(`Base clínica HTTP ${response.status}`);

    let html=await response.text();
    if(!html.includes('id="atlasShell"')||!html.includes('id="patientName"')){
      throw new Error('La base clínica recibida está incompleta.');
    }

    status.textContent='Integrando mapa, registro y resumen…';
    html=html
      .replace(/<title>[^<]*<\/title>/,'<title>ORION Armonización Orofacial V1.5.1</title>')
      .replace(/registro-v145\.css\?v=[^"']+/,'registro-v145.css?v=1.5.1')
      .replace('</head>',
        '<meta name="application-name" content="ORION Armonización Orofacial">'+
        '<link rel="manifest" href="./manifest.webmanifest?v=1.5.1">'+
        '<link rel="apple-touch-icon" href="../../assets/icons/icon-192.png">'+
        '<script>document.documentElement.classList.add("oa-viewport-v150")<\\/script>'+
        '<link rel="stylesheet" href="./anatomy-calibration-v146.css?v=1.5.1">'+
        '<link rel="stylesheet" href="./workflow-v147.css?v=1.5.1">'+
        '<link rel="stylesheet" href="./map-dynamic-v148.css?v=1.5.1">'+
        '<link rel="stylesheet" href="./map-inline-v149.css?v=1.5.1">'+
        '<link rel="stylesheet" href="./map-viewport-v150.css?v=1.5.1">'+
        '</head>')
      .replace('<span class="oa-brand-mark" aria-hidden="true">✦</span>',
        '<img class="oa-brand-logo" src="../../assets/brand/orion-health.png" alt="ORION Health">')
      .replace(/Registro de toxina botulínica/g,'Registro de armonización orofacial')
      .replace(/Mapa anatómico y trazabilidad por punto/g,'Planificación, anatomía y trazabilidad por punto')
      .replace(/V1\.4\.5-r2/g,'V1.5.1')
      .replace('Los puntos son presets editables; deben ajustarse a la evaluación dinámica y anatómica.',
        'Toca un punto para editarlo, arrástralo para ajustar su posición o selecciona varios para aplicar una terapia común.')
      .replace(/<script src="\.\/registro-v145\.js\?v=[^"]+"><\/script>/,
        '<script src="./anatomy-presets-v146.js?v=1.5.1"><\\/script>'+
        '<script src="./registro-v145.js?v=1.5.1"><\\/script>'+
        '<script src="./workflow-v147.js?v=1.5.1"><\\/script>'+
        '<script src="./map-dynamic-v148.js?v=1.5.1"><\\/script>'+
        '<script src="./map-inline-v149.js?v=1.5.1"><\\/script>'+
        '<script src="./map-viewport-v150.js?v=1.5.1"><\\/script>'+
        '<script src="./standalone-v151.js?v=1.5.1"><\\/script>');

    if(!html.includes('map-viewport-v150.js')||!html.includes('workflow-v147.js')){
      throw new Error('No fue posible integrar los recursos funcionales.');
    }

    document.open();
    document.write(html);
    document.close();
  }catch(error){
    console.error('ORION Armonización no pudo iniciar:',error);
    status.textContent='Error de inicio';
    detail.textContent=` ${error.message||error}`;
    errorBox.style.display='block';
  }
})();
</script>
</body>
</html>
